name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.julia-version }} – Linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.10', '1.11']

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}

      - uses: julia-actions/cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install qmctoolscl
        run: pip install qmctoolscl

      - name: Install dependencies
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Run unit tests
        run: julia --project=. -e 'using Pkg; Pkg.test()'

      - name: Process coverage
        if: matrix.julia-version == '1.11'
        uses: julia-actions/julia-processcoverage@v1
        with:
          directories: src

      - name: Upload coverage to Codecov
        if: matrix.julia-version == '1.11'
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  notebooks:
    name: Notebooks – Linux
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for notebook/src changes
        id: changes
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -qE '^(demos/|src/|test/run_notebooks\.jl)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: julia-actions/setup-julia@v2
        if: steps.changes.outputs.run == 'true'
        with:
          version: '1.11'

      - uses: julia-actions/cache@v2
        if: steps.changes.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.changes.outputs.run == 'true'
        with:
          python-version: '3.12'

      - name: Install qmctoolscl
        if: steps.changes.outputs.run == 'true'
        run: pip install qmctoolscl

      - name: Install dependencies
        if: steps.changes.outputs.run == 'true'
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Run demo notebooks
        if: steps.changes.outputs.run == 'true'
        run: julia --project=. test/run_notebooks.jl
