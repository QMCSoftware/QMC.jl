name: "Doc/Unit Tests: Linux"

on:
  push:
    branches-ignore: [develop, master]
  pull_request:
    branches: [develop, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.julia-version }} – Linux
    runs-on: ubuntu-latest
    env:
      TEST_JOBS: ${{ vars.TEST_JOBS || '2' }}
      TEST_THREADS: ${{ vars.TEST_THREADS || '1' }}
    strategy:
      fail-fast: true
      matrix:
        julia-version: ['1.12']

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}

      - uses: julia-actions/cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: test/requirements.txt

      - name: Install qmctoolscl
        run: pip install -r test/requirements.txt

      - name: Install dependencies
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Run unit tests
        run: make test TEST_JOBS=$TEST_JOBS TEST_THREADS=$TEST_THREADS

      - name: Run doctests
        run: make doctest DOC_DEPOT="$HOME/.julia"
