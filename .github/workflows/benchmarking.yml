name: Benchmarking

on:
  push:
    branches: [develop, master]
    paths:
      - 'src/**'
      - 'benchmark/*.jl'
      - 'benchmark/*.py'
      - 'benchmark/Project.toml'
      - 'benchmark/Manifest.toml'
      - 'benchmark/requirements.txt'
      - 'benchmark/qmcpy-requirements.txt'
      - 'benchmark/tune.json'
      - 'Makefile'
      - 'Project.toml'
      - 'Manifest.toml'
      - 'test/requirements.txt'
      - '.github/workflows/benchmarking.yml'
  workflow_dispatch:

concurrency:
  group: benchmarking-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  benchmark:
    name: Benchmarking – Julia ${{ matrix.julia-version }} – ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      # Override with the repository/org Actions variable `BENCH_BLAS_THREADS`
      # when you want a different native-kernel thread count.
      BENCH_BLAS_THREADS: ${{ vars.BENCH_BLAS_THREADS || '2' }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            julia-version: '1.12'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}

      - uses: julia-actions/cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: benchmark/requirements.txt

      - name: Install benchmark Python dependencies
        run: pip install -r benchmark/requirements.txt

      - name: Select baseline
        shell: bash
        run: |
          BENCH_COMPARE_REV=HEAD
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            BENCH_COMPARE_REV="${{ github.event.before }}"
          fi
          echo "BENCH_COMPARE_REV=$BENCH_COMPARE_REV" >> "$GITHUB_ENV"
          echo "BENCH_LABEL=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Run benchmarks
        run: |
          export QMC_BENCH_BLAS_THREADS="$BENCH_BLAS_THREADS"
          export OPENBLAS_NUM_THREADS="$BENCH_BLAS_THREADS"
          export MKL_NUM_THREADS="$BENCH_BLAS_THREADS"
          export OMP_NUM_THREADS="$BENCH_BLAS_THREADS"
          export NUMEXPR_NUM_THREADS="$BENCH_BLAS_THREADS"
          make bench-all REV="$BENCH_COMPARE_REV" LABEL="$BENCH_LABEL" BENCH_BLAS_THREADS="$BENCH_BLAS_THREADS"

      - name: Generate benchmark badges
        if: github.ref_name == 'develop' || github.ref_name == 'master'
        run: julia --project=benchmark benchmark/generate_badges.jl "$BENCH_LABEL" "${{ github.ref_name }}"

      - name: Publish benchmark badges
        if: github.ref_name == 'develop' || github.ref_name == 'master'
        env:
          BADGE_BRANCH: benchmark-badges
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          cd "$tmpdir"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin "$BADGE_BRANCH" >/dev/null 2>&1; then
            git fetch --depth=1 origin "$BADGE_BRANCH"
            git checkout -b "$BADGE_BRANCH" FETCH_HEAD
          else
            git checkout --orphan "$BADGE_BRANCH"
          fi
          rm -rf badges
          mkdir -p archive/${{ github.ref_name }}/${BENCH_LABEL}
          cp -R "$GITHUB_WORKSPACE/benchmark/results/badges" .
          snapshot_dir="archive/${{ github.ref_name }}/${BENCH_LABEL}"
          cp "$GITHUB_WORKSPACE/benchmark/results/${BENCH_LABEL}.json" "$snapshot_dir/"
          cp "$GITHUB_WORKSPACE/benchmark/results/${BENCH_LABEL}_memory.json" "$snapshot_dir/"
          cp "$GITHUB_WORKSPACE/benchmark/results/${BENCH_LABEL}_solutions.json" "$snapshot_dir/"
          cp "$GITHUB_WORKSPACE/benchmark/results/${BENCH_LABEL}_oracles.json" "$snapshot_dir/"
          cp "$GITHUB_WORKSPACE/benchmark/results/qmcpy_${BENCH_LABEL}.json" "$snapshot_dir/"
          cp "$GITHUB_WORKSPACE/benchmark/results/compare_${BENCH_LABEL}.md" "$snapshot_dir/"
          cp "$GITHUB_WORKSPACE/benchmark/results/compare_python_${BENCH_LABEL}.md" "$snapshot_dir/"
          cp "$GITHUB_WORKSPACE/benchmark/results/compare_python_summary_${BENCH_LABEL}.json" "$snapshot_dir/"
          cat > "$snapshot_dir/manifest.json" <<EOF
          {
            "branch": "${{ github.ref_name }}",
            "label": "${BENCH_LABEL}",
            "commit_sha": "${GITHUB_SHA}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_number": "${GITHUB_RUN_NUMBER}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "source_manifest": "badges/benchmark-source-${{ github.ref_name }}.json",
            "archived_files": [
              "${BENCH_LABEL}.json",
              "${BENCH_LABEL}_memory.json",
              "${BENCH_LABEL}_solutions.json",
              "${BENCH_LABEL}_oracles.json",
              "qmcpy_${BENCH_LABEL}.json",
              "compare_${BENCH_LABEL}.md",
              "compare_python_${BENCH_LABEL}.md",
              "compare_python_summary_${BENCH_LABEL}.json"
            ]
          }
          EOF
          mkdir -p "archive/${{ github.ref_name }}"
          cat > "archive/${{ github.ref_name }}/latest.json" <<EOF
          {
            "branch": "${{ github.ref_name }}",
            "label": "${BENCH_LABEL}",
            "commit_sha": "${GITHUB_SHA}",
            "snapshot_dir": "${snapshot_dir}",
            "source_manifest": "badges/benchmark-source-${{ github.ref_name }}.json"
          }
          EOF
          cat > README.md <<'EOF'
          Benchmark badge JSON and archived source snapshots for Shields.io.
          Latest badge source manifests live under `badges/`.
          Historical snapshots of the exact benchmark result files used for each badge update live under `archive/<branch>/<label>/`.
          EOF
          git add badges archive README.md
          git commit -m "Update benchmark badges for ${GITHUB_SHA}" || exit 0
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:"$BADGE_BRANCH"; then
              exit 0
            fi
            git fetch --depth=1 origin "$BADGE_BRANCH"
            git rebase "origin/$BADGE_BRANCH"
          done
          echo "Failed to publish benchmark badges after 5 attempts" >&2
          exit 1

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-julia-${{ matrix.julia-version }}-${{ github.ref_name }}-${{ github.run_number }}
          path: benchmark/results
          if-no-files-found: error

  benchmark_coverage:
    if: github.ref_name == 'develop' || github.ref_name == 'master'
    needs: benchmark
    name: Benchmark Coverage – Julia 1.12 – ubuntu-latest
    runs-on: ubuntu-latest
    env:
      BENCH_BLAS_THREADS: ${{ vars.BENCH_BLAS_THREADS || '2' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'

      - uses: julia-actions/cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: benchmark/requirements.txt

      - name: Install benchmark Python dependencies
        run: pip install -r benchmark/requirements.txt

      - name: Run benchmark coverage
        run: |
          export QMC_BENCH_BLAS_THREADS="$BENCH_BLAS_THREADS"
          export OPENBLAS_NUM_THREADS="$BENCH_BLAS_THREADS"
          export MKL_NUM_THREADS="$BENCH_BLAS_THREADS"
          export OMP_NUM_THREADS="$BENCH_BLAS_THREADS"
          export NUMEXPR_NUM_THREADS="$BENCH_BLAS_THREADS"
          make bench-coverage BENCH_BLAS_THREADS="$BENCH_BLAS_THREADS"

      - name: Upload benchmark coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-bench-${{ github.ref_name }}-${{ github.run_number }}
          path: lcov.info
          if-no-files-found: error

      - name: Upload benchmark coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          flags: bench
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
