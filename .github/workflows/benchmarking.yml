name: Benchmarking

on:
  push:
    branches: [choi] # temp
  #schedule:
  #  - cron: '30 5 * * *'   # 05:30 UTC daily
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  test:
    name: Nightly – Julia ${{ matrix.julia-version }} – ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      # Override with the repository/org Actions variable `BENCH_BLAS_THREADS`
      # when you want a different native-kernel thread count in nightly.
      BENCH_BLAS_THREADS: ${{ vars.BENCH_BLAS_THREADS || '2' }}
      TEST_JOBS: ${{ vars.TEST_JOBS || '2' }}
      TEST_THREADS: ${{ vars.TEST_THREADS || '1' }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            julia-version: '1.12'

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}

      - uses: julia-actions/cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install qmctoolscl and qmcpy
        # Intentionally unpinned: Nightly is the early-warning canary that runs
        # against the newest qmctoolscl release, so it surfaces upstream changes
        # before they reach the version pinned in test/requirements.txt. The
        # benchmark stage also requires qmcpy for the Python comparison harness.
        run: pip install --upgrade qmctoolscl qmcpy

      - name: Install dependencies
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Run benchmark
        run: |
          export QMC_BENCH_BLAS_THREADS="$BENCH_BLAS_THREADS"
          export OPENBLAS_NUM_THREADS="$BENCH_BLAS_THREADS"
          export MKL_NUM_THREADS="$BENCH_BLAS_THREADS"
          export OMP_NUM_THREADS="$BENCH_BLAS_THREADS"
          export NUMEXPR_NUM_THREADS="$BENCH_BLAS_THREADS"
          make ci BENCH_BLAS_THREADS="$BENCH_BLAS_THREADS"
