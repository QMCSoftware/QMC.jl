name: "Doc &Unit Tests: 3 OSes"

on:
  push:
    branches: [develop, master]
  #pull_request:
  #  branches: [develop, master]
  workflow_dispatch:

concurrency:
  group: ci-full-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.julia-version }} – ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            julia-version: '1.10'
          - os: ubuntu-latest
            julia-version: '1.11'
          - os: macos-latest
            julia-version: '1.12'
          - os: windows-latest
            julia-version: '1.12'

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}

      - uses: julia-actions/cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install qmctoolscl
        run: pip install -r test/requirements.txt

      - name: Install dependencies
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Run unit tests
        run: julia --project=. -e 'using Pkg; Pkg.test()'

      - name: Run doctests
        if: matrix.os == 'windows-latest' && matrix.julia-version == '1.10'
        run: make doctest
