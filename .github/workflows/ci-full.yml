name: "Doc/Unit Tests: 3 OSes"

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]
    paths:
      - 'src/**'
      - 'test/**'
      - 'docs/**'
      - 'benchmark/**'
      - '.github/**'
      - 'Project.toml'
      - 'Manifest.toml'
      - 'Makefile'
  workflow_dispatch:

concurrency:
  group: ci-full-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.julia-version }} – ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      TEST_JOBS: ${{ vars.TEST_JOBS || '2' }}
      TEST_THREADS: ${{ vars.TEST_THREADS || '1' }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            julia-version: '1.10'
            coverage: false
          - os: ubuntu-latest
            julia-version: '1.11'
            coverage: true
          - os: macos-latest
            julia-version: '1.12'
            coverage: false
          - os: windows-latest
            julia-version: '1.12'
            coverage: false

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}

      - uses: julia-actions/cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: test/requirements.txt

      - name: Install qmctoolscl
        run: pip install -r test/requirements.txt

      - name: Install dependencies
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Run unit tests with coverage
        if: ${{ matrix.coverage }}
        run: make coverage TEST_JOBS=$TEST_JOBS TEST_THREADS=$TEST_THREADS

      - name: Run unit tests
        if: ${{ !matrix.coverage }}
        run: julia --project=. -e 'using Pkg; Pkg.test()'

      - name: Upload LCOV artifact
        if: ${{ matrix.coverage }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-julia-${{ matrix.julia-version }}-${{ runner.os }}
          path: lcov.info
          if-no-files-found: warn

      - name: Upload coverage to Codecov
        if: ${{ matrix.coverage }}
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
