name: "Doc/Unit Tests"

on:
  push:
  pull_request:
    branches: [develop, master]
  workflow_dispatch:

concurrency:
  # Keep push and pull_request runs separate so same-SHA PR updates do not
  # inherit cancelled push checks.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  select-matrix:
    name: Select CI scope
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.scope.outputs.matrix }}
    steps:
      - name: Decide runner matrix
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          full_sweep=false
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            full_sweep=true
          elif [[ "$EVENT_NAME" == "pull_request" && ( "$BASE_REF" == "develop" || "$BASE_REF" == "master" ) ]]; then
            full_sweep=true
          elif [[ "$REF_NAME" == "develop" || "$REF_NAME" == "master" ]]; then
            full_sweep=true
          fi

          if [[ "$full_sweep" == "true" ]]; then
            matrix_json='{"include":[{"os":"ubuntu-latest","julia-version":"1.10","run-doctests":false,"coverage":false},{"os":"ubuntu-latest","julia-version":"1.11","run-doctests":true,"coverage":true},{"os":"ubuntu-latest","julia-version":"1.12","run-doctests":true,"coverage":false},{"os":"macos-latest","julia-version":"1.12","run-doctests":false,"coverage":false},{"os":"windows-latest","julia-version":"1.12","run-doctests":false,"coverage":false},{"os":"ubuntu-latest","julia-version":"nightly","run-doctests":false,"coverage":false,"continue-on-error":true}]}'
          else
            matrix_json='{"include":[{"os":"ubuntu-latest","julia-version":"1.10","run-doctests":false,"coverage":false},{"os":"ubuntu-latest","julia-version":"1.11","run-doctests":true,"coverage":false},{"os":"ubuntu-latest","julia-version":"1.12","run-doctests":true,"coverage":false}]}'
          fi
          printf 'matrix=%s\n' "$matrix_json" >> "$GITHUB_OUTPUT"

  test:
    needs: select-matrix
    name: Julia ${{ matrix.julia-version }} – ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    continue-on-error: ${{ matrix.continue-on-error == true }}
    env:
      TEST_JOBS: ${{ vars.TEST_JOBS || '2' }}
      TEST_THREADS: ${{ vars.TEST_THREADS || '1' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-matrix.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}

      - uses: julia-actions/cache@v2

      - name: Install dependencies
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.build("QMCToolsCL_jll")'

      - name: Show Julia environment info
        if: ${{ matrix.julia-version == 'nightly' }}
        run: julia --project=. -e 'using InteractiveUtils; versioninfo(); using Pkg; Pkg.status()'

      - name: Run unit tests with coverage
        if: ${{ matrix.coverage && github.event_name != 'pull_request' && (github.ref_name == 'develop' || github.ref_name == 'master') }}
        run: make coverage TEST_JOBS=$TEST_JOBS TEST_THREADS=$TEST_THREADS

      - name: Run unit tests
        if: ${{ (!matrix.coverage || github.event_name == 'pull_request' || (github.ref_name != 'develop' && github.ref_name != 'master')) && matrix.os == 'ubuntu-latest' }}
        run: make test TEST_JOBS=$TEST_JOBS TEST_THREADS=$TEST_THREADS

      - name: Run unit tests
        if: ${{ (!matrix.coverage || github.event_name == 'pull_request' || (github.ref_name != 'develop' && github.ref_name != 'master')) && matrix.os != 'ubuntu-latest' }}
        run: julia --project=. -e 'using Pkg; Pkg.test()'

      - name: Run doctests
        if: ${{ matrix.run-doctests }}
        run: make doctest DOC_DEPOT="$HOME/.julia"

      - name: Upload LCOV artifact
        if: ${{ matrix.coverage && github.event_name != 'pull_request' && (github.ref_name == 'develop' || github.ref_name == 'master') }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-julia-${{ matrix.julia-version }}-${{ runner.os }}
          path: lcov.info
          if-no-files-found: warn

      - name: Upload coverage to Codecov
        if: ${{ matrix.coverage && github.event_name != 'pull_request' && (github.ref_name == 'develop' || github.ref_name == 'master') }}
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          flags: unit
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Generate unit coverage badge
        if: ${{ matrix.coverage && github.event_name != 'pull_request' && (github.ref_name == 'develop' || github.ref_name == 'master') }}
        run: julia --project=. devtools/generate_coverage_badges.jl lcov.info unit "${{ github.ref_name }}" coverage_badges

      - name: Publish unit coverage badge
        if: ${{ matrix.coverage && github.event_name != 'pull_request' && (github.ref_name == 'develop' || github.ref_name == 'master') }}
        env:
          BADGE_BRANCH: benchmark-badges
          BADGE_DIR: coverage_badges
          COVERAGE_SCOPE: unit
          LCOV_PATH: lcov.info
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          export COVERAGE_LABEL="sha-${GITHUB_SHA::7}"
          bash devtools/publish_coverage_badges.sh
