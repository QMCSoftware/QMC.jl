name: "Install Test"

# Verifies that:
#   1. `using QuasiMC` succeeds without qmctoolscl installed.
#   2. Pure-Julia generators (IIDStdUniform, Kronecker) work normally.
#   3. QMCToolsCL-backed generators (Lattice, DigitalNetB2, Halton) work on a
#      clean install with no Python dependency.
#   4. An invalid QUASIMC_QMCTOOLSCL_LIB override yields a clear error.
#
# This guards the external-user install path after the staged QMCToolsCL_jll
# migration: QuasiMC should be usable after `Pkg.add` alone, with no Python
# needed for the built-in low-discrepancy generators.

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]
    paths:
      - 'src/**'
      - 'Project.toml'
      - '.github/workflows/install-test.yml'
  workflow_dispatch:

concurrency:
  group: install-test-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-test:
    name: Binary install smoke — Julia ${{ matrix.julia-version }} — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            julia-version: '1.10'
          - os: ubuntu-latest
            julia-version: '1.12'
          - os: macos-latest
            julia-version: '1.12'
          - os: windows-latest
            julia-version: '1.12'

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}

      - uses: julia-actions/cache@v2

      - name: Install Julia dependencies
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.build("QMCToolsCL_jll")'

      - name: Generators work without Python
        run: |
          julia --project=. -e '
            using QuasiMC

            dd = IIDStdUniform(3; seed=7)
            x = gen_samples(dd, 4)
            @assert size(x) == (4, 3) "IIDStdUniform size wrong: $(size(x))"
            println("IIDStdUniform OK: ", size(x))

            kron = Kronecker(3; seed=1)
            y = gen_samples(kron, 4)
            @assert size(y) == (4, 3) "Kronecker size wrong: $(size(y))"
            println("Kronecker OK: ", size(y))

            lat = gen_samples(Lattice(3; seed=7), 4)
            @assert size(lat) == (4, 3) "Lattice size wrong: $(size(lat))"
            println("Lattice OK: ", size(lat))

            dnb2 = gen_samples(DigitalNetB2(3; seed=7), 4)
            @assert size(dnb2) == (4, 3) "DigitalNetB2 size wrong: $(size(dnb2))"
            println("DigitalNetB2 OK: ", size(dnb2))

            hal = gen_samples(Halton(3; seed=7), 4)
            @assert size(hal) == (4, 3) "Halton size wrong: $(size(hal))"
            println("Halton OK: ", size(hal))
          '

      - name: Invalid library override gives a clear error
        run: |
          julia --project=. -e '
            ENV["QUASIMC_QMCTOOLSCL_LIB"] = joinpath(pwd(), "definitely-missing-qmctoolscl")
            using QuasiMC
            try
              QuasiMC._qmctoolscl_lib_path()
              error("Expected invalid QUASIMC_QMCTOOLSCL_LIB to fail")
            catch e
              msg = sprint(showerror, e)
              occursin("QUASIMC_QMCTOOLSCL_LIB", msg) ||
                error("Error did not mention QUASIMC_QMCTOOLSCL_LIB:\n", msg)
              occursin("definitely-missing-qmctoolscl", msg) ||
                error("Error did not mention the bad path:\n", msg)
              println("Invalid override error is actionable: OK")
            end
          '
