name: Nightly

on:
  schedule:
    - cron: '30 5 * * *'   # 05:30 UTC daily
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  test:
    name: Nightly – Julia ${{ matrix.julia-version }} – ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            julia-version: '1.12'

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}

      - uses: julia-actions/cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install qmctoolscl (latest)
        # Intentionally unpinned: Nightly is the early-warning canary that runs
        # against the newest qmctoolscl release, so it surfaces upstream changes
        # before they reach the version pinned in test/requirements.txt.
        run: pip install --upgrade qmctoolscl

      - name: Install dependencies
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Run benchmark
        run: make ci
