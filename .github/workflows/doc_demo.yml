name: Docs and Demos

on:
  push:
    branches: [develop, master]
    paths:
      - 'docs/**'
      - 'demos/**'
      - 'src/**'
      - 'test/run_notebooks.jl'
      - 'Makefile'
      - 'Project.toml'
      - 'Manifest.toml'
      - 'test/requirements.txt'
      - '.github/workflows/doc_demo.yml'
  pull_request:
    branches: [develop, master]
    paths:
      - 'docs/**'
      - 'src/**'
      - 'Project.toml'
      - 'Manifest.toml'
      - 'Makefile'
      - 'test/requirements.txt'
      - '.github/workflows/doc_demo.yml'
  workflow_dispatch:

concurrency:
  group: docs-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'

      - uses: julia-actions/cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: test/requirements.txt

      - name: Install qmctoolscl
        run: pip install -r test/requirements.txt

      - name: Install dependencies
        run: |
          julia --project=docs -e '
            import Pkg
            Pkg.develop(Pkg.PackageSpec(path="."))
            Pkg.instantiate()
            Pkg.precompile()
          '

      - name: Build and deploy docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: "true"
        run: julia --project=docs docs/make.jl

  demos:
    if: github.event_name != 'pull_request'
    name: Run Demo Notebooks
    runs-on: ubuntu-latest
    timeout-minutes: 90        # explicit job timeout
    strategy:
      fail-fast: false          # let all shards run so every failure is visible
      matrix:
        shard_index: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'

      - uses: julia-actions/cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: test/requirements.txt

      - name: Install qmctoolscl
        run: pip install -r test/requirements.txt

      - name: Install dependencies
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Run demo notebooks
        timeout-minutes: 60
        # Call the Julia harness directly here. On GitHub's Ubuntu runner we
        # have seen `make notebook ...` occasionally fail with GNU make's
        # internal `wait: No child processes` despite the underlying notebook
        # harness still running, so bypass the wrapper in CI.
        run: |
          QUASIMC_SKIP_PKG_SETUP=1 GKSwstype=100 QUASIMC_NOTEBOOK_PYTHON="python" julia --threads=2 --project=. \
            test/run_notebooks.jl \
            --jobs=1 \
            --shard-count=4 \
            --shard-index=${{ matrix.shard_index }} \
            --overwrite=0 \
            --kernel=quasimc-1.12 \
            --timeout=7200

  doctest_coverage:
    if: github.event_name != 'pull_request' && (github.ref_name == 'develop' || github.ref_name == 'master')
    name: Doctest Coverage
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'

      - uses: julia-actions/cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: test/requirements.txt

      - name: Install qmctoolscl
        run: pip install -r test/requirements.txt

      - name: Run doctest coverage
        run: make doctest-coverage DOC_DEPOT="$HOME/.julia"

      - name: Upload doctest LCOV artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-doctest-${{ github.ref_name }}-${{ github.run_number }}
          path: lcov.info
          if-no-files-found: error

      - name: Upload doctest coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          flags: doctest
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  notebook_coverage:
    if: github.event_name != 'pull_request' && (github.ref_name == 'develop' || github.ref_name == 'master')
    name: Notebook Coverage
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'

      - uses: julia-actions/cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: test/requirements.txt

      - name: Install qmctoolscl
        run: pip install -r test/requirements.txt

      - name: Install dependencies
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Run notebook coverage
        shell: bash
        run: |
          set -euo pipefail
          find src -name '*.cov' -delete
          rm -f lcov.info
          QUASIMC_SKIP_PKG_SETUP=1 GKSwstype=100 QUASIMC_NOTEBOOK_PYTHON="python" julia --threads=1 --code-coverage=user --project=. \
            test/run_notebooks.jl \
            --jobs=2 \
            --shard-count=1 \
            --shard-index=1 \
            --overwrite=0 \
            --kernel=quasimc-1.12 \
            --timeout=7200
          julia --project=. devtools/process_coverage.jl src
          find src -name '*.cov' -delete

      - name: Upload notebook LCOV artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-notebook-${{ github.ref_name }}-${{ github.run_number }}
          path: lcov.info
          if-no-files-found: error

      - name: Upload notebook coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          flags: notebook
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
