name: Docs and Demos

on:
  push:
    branches: [develop, master]
    paths:
      - 'docs/**'
      - 'demos/**'
      - 'src/**'
      - 'test/run_notebooks.jl'
      - 'Makefile'
      - 'Project.toml'
      - 'Manifest.toml'
      - 'test/requirements.txt'
      - '.github/workflows/doc_demo.yml'
  workflow_dispatch:

concurrency:
  group: docs-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'

      - uses: julia-actions/cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: test/requirements.txt

      - name: Install qmctoolscl
        run: pip install -r test/requirements.txt

      - name: Install dependencies
        run: |
          julia --project=docs -e '
            import Pkg
            Pkg.develop(Pkg.PackageSpec(path="."))
            Pkg.instantiate()
            Pkg.precompile()
          '

      - name: Build and deploy docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: "true"
        run: julia --project=docs docs/make.jl

  demos:
    name: Run Demo Notebooks
    runs-on: ubuntu-latest
    timeout-minutes: 90        # explicit job timeout
    strategy:
      fail-fast: false          # let all shards run so every failure is visible
      matrix:
        shard_index: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'

      - uses: julia-actions/cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: test/requirements.txt

      - name: Install qmctoolscl
        run: pip install -r test/requirements.txt

      - name: Install dependencies
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Run demo notebooks
        timeout-minutes: 60
        # Call the Julia harness directly here. On GitHub's Ubuntu runner we
        # have seen `make notebook ...` occasionally fail with GNU make's
        # internal `wait: No child processes` despite the underlying notebook
        # harness still running, so bypass the wrapper in CI.
        run: |
          QMC_SKIP_PKG_SETUP=1 GKSwstype=100 QMC_NOTEBOOK_PYTHON="python" julia --threads=2 --project=. \
            test/run_notebooks.jl \
            --jobs=1 \
            --shard-count=4 \
            --shard-index=${{ matrix.shard_index }} \
            --overwrite=0 \
            --kernel=qmc-1.12 \
            --timeout=1800
