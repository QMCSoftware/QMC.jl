<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4063D8"/>
      <stop offset="50%" stop-color="#389826"/>
      <stop offset="100%" stop-color="#9558B2"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#bg)" opacity="0.9"/>
  <!-- QMC text -->
  <text x="100" y="90" text-anchor="middle" font-family="JuliaMono, monospace"
        font-size="52" font-weight="bold" fill="white" letter-spacing="2">QMC</text>
  <!-- .jl subtitle -->
  <text x="100" y="120" text-anchor="middle" font-family="JuliaMono, monospace"
        font-size="28" fill="white" opacity="0.85">.jl</text>
  <!-- Scattered QMC-style dots (low-discrepancy pattern) -->
  <g fill="white" opacity="0.4">
    <circle cx="35" cy="45" r="2.5"/>
    <circle cx="72" cy="155" r="2.5"/>
    <circle cx="140" cy="38" r="2.5"/>
    <circle cx="160" cy="160" r="2.5"/>
    <circle cx="50" cy="130" r="2.5"/>
    <circle cx="115" cy="165" r="2.5"/>
    <circle cx="165" cy="80" r="2.5"/>
    <circle cx="30" cy="85" r="2.5"/>
    <circle cx="88" cy="170" r="2.5"/>
    <circle cx="150" cy="120" r="2.5"/>
    <circle cx="55" cy="170" r="2.5"/>
    <circle cx="170" cy="45" r="2.5"/>
    <circle cx="40" cy="160" r="2.5"/>
    <circle cx="130" cy="170" r="2.5"/>
  </g>
</svg>
